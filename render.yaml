# Render blueprint for the SignalScout backend.
# Render is used rather than a serverless host because Phase 7 (realtime prices)
# needs long-lived WebSocket connections.
#
# Secrets are intentionally NOT stored here. DATABASE_URL and SECRET_KEY are
# marked sync:false so Render prompts for them instead of keeping them in git.
services:
  - type: web
    name: signalscout-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Tables are created here because the __main__ block never runs under gunicorn.
    preDeployCommand: flask --app app init-db
    # Socket.IO keeps per-connection state in the worker that accepted it.
    # With more than one worker and no shared message queue, a client's polling
    # requests can land on a worker that has never seen it, and the connection
    # breaks. Stay on a single threaded worker until a Redis queue is added.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --worker-class gthread --workers 1 --threads 8 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.9"
      # Neon connection string (postgresql://...?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
      - key: SECRET_KEY
        sync: false
      # Comma-separated allowed browser origins; set to the deployed frontend URL.
      - key: FRONTEND_URL
        sync: false
      - key: JWT_EXP_HOURS
        value: "24"
      # Seconds between realtime quote polls (yfinance has no streaming feed).
      # Lower values hit provider rate limits faster.
      - key: QUOTE_POLL_SECONDS
        value: "30"
      # Never enable Flask debug in production: the Werkzeug debugger allows RCE.
      - key: FLASK_DEBUG
        value: "0"
